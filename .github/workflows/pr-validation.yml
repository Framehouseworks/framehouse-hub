name: PR Quality Gate

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch: # Manual trigger for pre-merge verification

concurrency:
  # Scoped to PR number or the branch name if manually triggered
  group: pr-validation-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  # Enterprise Guardrail: Ensure main only accepts merges from dev
  guardrail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only run on PRs targeting main
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - name: Verify PR Source Branch
        if: github.head_ref != 'dev'
        run: |
          echo "### 🛑 Deployment Blocked" >> $GITHUB_STEP_SUMMARY
          echo "To maintain stability, 'main' only accepts merges from 'dev'." >> $GITHUB_STEP_SUMMARY
          echo "Please retarget your PR to 'dev' first." >> $GITHUB_STEP_SUMMARY
          exit 1

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: framehouse_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Schema Integrity
        run: |
          pnpm run generate:importmap
          pnpm run generate:types
          if [ -n "$(git status --porcelain)" ]; then
            echo "### 🛑 Schema Out of Sync" >> $GITHUB_STEP_SUMMARY
            echo "Changes detected after running 'generate:importmap' or 'generate:types'." >> $GITHUB_STEP_SUMMARY
            echo "Please run these commands locally and commit the changes." >> $GITHUB_STEP_SUMMARY
            git status --porcelain
            exit 1
          fi

      - name: Initialize Database Schema (Local)
        run: pnpm run payload migrate
        env:
          DATABASE_URI: postgres://postgres:password@localhost:5432/framehouse_ci
          PAYLOAD_SECRET: ci_secret

      - name: Verify Schema Drift
        run: |
          pnpm run payload migrate:create --name check_drift
          DRIFT_FILES=$(git status --porcelain src/migrations/)
          if [ -n "$DRIFT_FILES" ]; then
            echo "### 🛑 Database Schema Drift Detected" >> $GITHUB_STEP_SUMMARY
            echo "Your Payload configuration has changed but no corresponding migration file was generated or committed." >> $GITHUB_STEP_SUMMARY
            echo "Please run 'pnpm payload migrate:create' locally and commit the resulting migration files." >> $GITHUB_STEP_SUMMARY
            git status --porcelain src/migrations/
            exit 1
          fi
        env:
          DATABASE_URI: postgres://postgres:password@localhost:5432/framehouse_ci
          PAYLOAD_SECRET: ci_secret

      - name: Lint Check
        run: pnpm run lint

      - name: Production Build Check
        run: pnpm run build
        env:
          IS_BUILD_PHASE: 'true'
          DATABASE_URI: postgres://postgres:password@localhost:5432/framehouse_ci
          PAYLOAD_SECRET: ci_secret
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000

      # Vitest integration suite. globalSetup spins its own ephemeral
      # docker postgres so it doesn't contend with the CI service container
      # the e2e + build use. Tests cover writeOriginalToEnclave,
      # cleanupEnclave, disableLocalStorage, FK cascade migrations, and
      # the worker dispatch contract.
      - name: Run Integration Tests
        run: pnpm run test:int
        env:
          # PAYLOAD_SECRET is read by payload.config.ts on init. Same value
          # is fine here — globalSetup overrides DATABASE_URI to the
          # ephemeral container.
          PAYLOAD_SECRET: ci_secret

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      # In CI we skip the Go worker entirely. media-lifecycle.e2e
      # synthesises the worker callback itself (POSTs process-callback +
      # stages derivative bytes), which keeps the test deterministic,
      # fast, and free of native deps (no Go build, no cwebp install).
      # The worker is exercised by Phase 5 vitest specs and by local
      # development via scripts/dev-with-worker.sh.
      - name: Run Playwright E2E Tests
        run: pnpm exec playwright test tests/e2e/admin.e2e.spec.ts tests/e2e/media-lifecycle.e2e.spec.ts
        env:
          DATABASE_URI: postgres://postgres:password@localhost:5432/framehouse_ci
          PAYLOAD_SECRET: ci_secret
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
          SEED_SECRET: local_dev_only
          PROCESSOR_CALLBACK_SECRET: fallback-dev-secret-key-9988
          DISABLE_WORKER: '1'

  # High-Fidelity Validation: Test migrations against a clone of real data
  validate-remote-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Neon CLI
        run: pnpm install -g neonctl

      - name: Determine Parent Branch
        id: parent
        run: |
          # Default to dev if manually triggered or branch is unknown
          if [[ "${{ github.base_ref }}" == "main" ]]; then
            echo "branch=production" >> $GITHUB_OUTPUT
          else
            echo "branch=dev" >> $GITHUB_OUTPUT
          fi

      - name: Create Ephemeral Database Branch
        id: neon
        run: |
          # Use PR number or a timestamp-based ID for manual runs
          ID="${{ github.event.pull_request.number || github.run_id }}"
          BRANCH_NAME="gh-pr-${ID}"
          echo "Creating branch $BRANCH_NAME from ${{ steps.parent.outputs.branch }}..."

          # Create the branch and capture the connection string
          neonctl branches create --name "$BRANCH_NAME" --parent "${{ steps.parent.outputs.branch }}" --project-id ${{ env.NEON_PROJECT_ID }}

          # Get the connection string for the new branch
          CONNECTION_STRING=$(neonctl connection-string "$BRANCH_NAME" --project-id ${{ env.NEON_PROJECT_ID }})

          # Mask the connection string in logs
          echo "::add-mask::$CONNECTION_STRING"
          echo "db_uri=$CONNECTION_STRING" >> $GITHUB_OUTPUT
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}

      - name: Run Migrations against Ephemeral Branch
        run: |
          if [[ "$RAW_URI" != *"sslmode="* ]]; then
            export DATABASE_URI="${RAW_URI}?sslmode=require"
          else
            export DATABASE_URI="$RAW_URI"
          fi

          echo "Verifying migrations against ephemeral clone of ${{ steps.parent.outputs.branch }}..."
          pnpm run payload migrate
        env:
          NODE_ENV: production
          RAW_URI: ${{ steps.neon.outputs.db_uri }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET_DEV }}

      - name: Seed Ephemeral Database
        run: |
          if [[ "$RAW_URI" != *"sslmode="* ]]; then
            export DATABASE_URI="${RAW_URI}?sslmode=require"
          else
            export DATABASE_URI="$RAW_URI"
          fi

          echo "Verifying 'Day Zero' seeding against ephemeral clone..."
          pnpm run seed
        env:
          NODE_ENV: production
          RAW_URI: ${{ steps.neon.outputs.db_uri }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET_DEV }}
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000

      - name: Cleanup Ephemeral Branch
        if: always()
        run: |
          echo "Deleting ephemeral branch $BRANCH_NAME..."
          neonctl branches delete "$BRANCH_NAME" --project-id ${{ env.NEON_PROJECT_ID }} --force
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          BRANCH_NAME: ${{ steps.neon.outputs.branch_name }}
