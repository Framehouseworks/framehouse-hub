name: PR Validation

on:
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/pull_request_template.md'
  workflow_dispatch:

# Cancel in-progress runs for the same PR when new commits are pushed.
# workflow_dispatch uses run_id so manual triggers never cancel live PR checks.
concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# No workflow-level permissions — every job declares only what it needs.
# This limits the blast radius of any supply-chain compromise in a third-party action.
permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ─────────────────────────────────────────────────────────────────────────────
# GUARDRAIL — main only accepts merges from dev
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  guardrail:
    name: Guardrail
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    permissions:
      contents: read
    steps:
      - name: Verify PR source branch
        if: github.head_ref != 'dev'
        run: |
          echo "### 🛑 Merge Blocked" >> $GITHUB_STEP_SUMMARY
          echo "\`main\` only accepts merges from \`dev\`. Retarget your PR." >> $GITHUB_STEP_SUMMARY
          exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # QUALITY GATE — tsc · lint · schema integrity · build
  # No DB required. tsc fast-fails on type errors (~30 s) before the 4-min build.
  # Uploads the .next artifact so the e2e job can reuse it without rebuilding.
  # ─────────────────────────────────────────────────────────────────────────────
  quality_gate:
    name: Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ vars.NODE_VERSION }}
          pnpm-version: ${{ vars.PNPM_VERSION }}

      - name: TypeScript type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Verify schema integrity (importmap + types)
        run: |
          pnpm run generate:importmap
          pnpm run generate:types
          if [ -n "$(git status --porcelain)" ]; then
            echo "### 🛑 Schema Out of Sync" >> $GITHUB_STEP_SUMMARY
            echo "Run \`generate:importmap\` and \`generate:types\` locally and commit the diff." >> $GITHUB_STEP_SUMMARY
            git status --porcelain
            exit 1
          fi
        env:
          PAYLOAD_SECRET: ci_secret

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-pr-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.ts','src/**/*.tsx') }}
          restore-keys: nextjs-pr-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Production build
        run: pnpm run build
        env:
          IS_BUILD_PHASE: 'true'
          PAYLOAD_SECRET: ci_secret
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000

      # Retention 3 days — must survive re-runs of failed e2e jobs across day boundaries.
      # 1 day was too short: on a failed-job re-run the next day quality_gate doesn't
      # re-run, so the artifact must still be available from the original run.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-pr-${{ github.run_id }}
          path: .next/
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: true

  # ─────────────────────────────────────────────────────────────────────────────
  # INTEGRATION TESTS — vitest, postgres provided as a service container.
  # vitest.globalSetup.ts skips Docker management when DATABASE_URI is pre-set.
  # Runs in parallel with quality_gate — no dependency between them.
  # ─────────────────────────────────────────────────────────────────────────────
  integration_tests:
    name: Integration Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      actions: write

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: framehouse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ vars.NODE_VERSION }}
          pnpm-version: ${{ vars.PNPM_VERSION }}

      - name: Set DATABASE_URI
        run: echo "DATABASE_URI=postgres://postgres:test@localhost:5432/framehouse_test" >> $GITHUB_ENV

      - name: Run integration tests
        run: |
          pnpm run test:int \
            --reporter=verbose \
            --reporter=junit \
            --outputFile.junit=test-results/junit.xml
        env:
          PAYLOAD_SECRET: ci_secret

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results-${{ github.run_id }}
          path: test-results/junit.xml
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # E2E SHARD — Playwright split across 2 parallel runners via matrix strategy.
  # Each shard runs half the test suite (--shard=N/2), halving wall-clock time.
  # Downloads .next artifact from quality_gate — avoids ~4 min rebuild per shard.
  # DISABLE_WORKER=1 skips the Go worker; the callback is synthesised in tests.
  # ─────────────────────────────────────────────────────────────────────────────
  e2e_shard:
    name: E2E / Shard ${{ matrix.shard }} of 2
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [quality_gate, integration_tests]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    permissions:
      contents: read
      checks: write
      pull-requests: write
      actions: write

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: framehouse_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ vars.NODE_VERSION }}
          pnpm-version: ${{ vars.PNPM_VERSION }}

      - name: Assemble DATABASE_URI
        run: |
          URI="postgres://postgres:${{ secrets.CI_DB_PASSWORD }}@localhost:5432/framehouse_ci"
          echo "::add-mask::$URI"
          echo "DATABASE_URI=$URI" >> $GITHUB_ENV

      - name: Apply migrations
        run: pnpm run payload migrate
        env:
          PAYLOAD_SECRET: ci_secret

      # Run only on shard 1 — drift is a code-quality check, not per-shard work.
      - name: Verify schema drift
        if: matrix.shard == 1
        run: |
          # printf 'n\n' answers the "create blank migration?" prompt that
          # Payload/drizzle-kit shows when no schema changes are detected.
          # Without it, </dev/null causes an EOF that makes the command exit 1.
          # We ignore the exit code entirely and rely solely on git status to
          # detect real drift (new migration files = uncommitted schema change).
          # timeout 90 is a hard circuit-breaker against future drizzle-kit regressions.
          printf 'n\n' | timeout 90 pnpm run payload migrate:create --name check_drift 2>&1 | cat
          EC=${PIPESTATUS[1]}
          if [ "$EC" = "124" ]; then
            echo "### 🛑 Schema drift check timed out (90 s)" >> $GITHUB_STEP_SUMMARY
            echo "drizzle-kit may have rendered an interactive TUI despite the pipe redirect." >> $GITHUB_STEP_SUMMARY
            echo "Bump drizzle-kit or investigate with: pnpm payload migrate:create --name check_drift" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          DRIFT=$(git status --porcelain src/migrations/)
          if [ -n "$DRIFT" ]; then
            echo "### 🛑 Schema Drift Detected" >> $GITHUB_STEP_SUMMARY
            echo "Run \`pnpm payload migrate:create\` locally and commit the output." >> $GITHUB_STEP_SUMMARY
            git status --porcelain src/migrations/
            exit 1
          fi
        env:
          PAYLOAD_SECRET: ci_secret

      # Reuse the .next artifact built by quality_gate — no rebuild needed
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-pr-${{ github.run_id }}
          path: .next/

      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run E2E tests (shard ${{ matrix.shard }}/2)
        run: |
          pnpm exec playwright test \
            tests/e2e/admin.e2e.spec.ts \
            tests/e2e/media-lifecycle.e2e.spec.ts \
            tests/e2e/globalSearch.spec.ts \
            --shard=${{ matrix.shard }}/2 \
            --reporter=github,blob
        env:
          CI: 'true'
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
          PAYLOAD_SECRET: ci_secret
          SEED_SECRET: ${{ secrets.SEED_SECRET }}
          PROCESSOR_CALLBACK_SECRET: ${{ secrets.PROCESSOR_CALLBACK_SECRET_DEV }}
          DISABLE_WORKER: '1'

      - name: Upload blob report (shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-blob-${{ matrix.shard }}-${{ github.run_id }}
          path: blob-report/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # MERGE E2E REPORTS — combines shard blob reports into a single HTML report
  # Only uploaded on failure to avoid accumulating large passing-run artifacts.
  # ─────────────────────────────────────────────────────────────────────────────
  merge_e2e_reports:
    name: Merge E2E Reports
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [e2e_shard]
    if: needs.e2e_shard.result == 'failure'
    permissions:
      contents: read
      checks: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ vars.NODE_VERSION }}
          pnpm-version: ${{ vars.PNPM_VERSION }}

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-blob-*-${{ github.run_id }}
          merge-multiple: true
          path: all-blob-reports/

      - name: Merge blob reports into HTML
        run: pnpm exec playwright merge-reports --reporter=html ./all-blob-reports/

      - name: Upload merged HTML report
        if: needs.e2e_shard.result == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # REMOTE MIGRATIONS — Neon ephemeral branch, dev→main PRs only
  # Pre-flight delete makes branch creation idempotent across re-runs.
  # Conserves Neon branch quota (max 10 free) by running only on dev→main.
  # ─────────────────────────────────────────────────────────────────────────────
  remote_migrations:
    name: Remote Migration Check (Neon)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [e2e_shard]
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ vars.NODE_VERSION }}
          pnpm-version: ${{ vars.PNPM_VERSION }}

      - name: Create ephemeral Neon branch (idempotent)
        id: neon
        run: |
          ID="${{ github.event.pull_request.number || github.run_id }}"
          BRANCH_NAME="gh-pr-${ID}"

          pnpm exec neonctl branches delete "$BRANCH_NAME" \
            --project-id "${{ vars.NEON_PROJECT_ID }}" \
            --force 2>/dev/null || true

          pnpm exec neonctl branches create \
            --name "$BRANCH_NAME" \
            --parent production \
            --project-id "${{ vars.NEON_PROJECT_ID }}"

          # xargs trims leading whitespace (neonctl output quirk — mirrors setup-eventarc.sh fix)
          CONNECTION_STRING=$(pnpm exec neonctl connection-string "$BRANCH_NAME" \
            --project-id "${{ vars.NEON_PROJECT_ID }}" | xargs)
          echo "::add-mask::$CONNECTION_STRING"
          echo "db_uri=$CONNECTION_STRING" >> $GITHUB_OUTPUT
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}

      - name: Assemble Neon DATABASE_URI
        run: |
          RAW="${{ steps.neon.outputs.db_uri }}"
          [[ "$RAW" != *"sslmode="* ]] && RAW="${RAW}?sslmode=require"
          echo "::add-mask::$RAW"
          echo "NEON_DATABASE_URI=$RAW" >> $GITHUB_ENV

      - name: Run migrations against ephemeral branch
        run: DATABASE_URI="$NEON_DATABASE_URI" pnpm run payload migrate
        env:
          NODE_ENV: production
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET_DEV }}

      - name: Seed ephemeral branch
        run: DATABASE_URI="$NEON_DATABASE_URI" pnpm run seed
        env:
          NODE_ENV: production
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET_DEV }}
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000

      - name: Cleanup Neon branch
        if: always()
        run: |
          pnpm exec neonctl branches delete "${{ steps.neon.outputs.branch_name }}" \
            --project-id "${{ vars.NEON_PROJECT_ID }}" \
            --force
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
