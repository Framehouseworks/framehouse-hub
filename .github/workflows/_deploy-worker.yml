name: _Deploy Worker (Reusable)
# Reusable workflow — called by deploy-worker-dev.yml and deploy-worker-prod.yml.
# Underscore prefix marks this as an internal utility; never triggered directly.
#
# Path-scoped triggers in callers mean this only runs when scripts/worker/** changes,
# keeping Artifact Registry under the 0.5 GB free-tier allowance.
#
# Cloud Run worker resource shape (free-tier tuned):
#   --min-instances=0       zero idle cost; cold-start is acceptable for async processing
#   --max-instances=2       caps Eventarc backlog burst; prevents runaway billing
#   --memory=512Mi          sufficient for sharp / cwebp on ~10 MP JPEGs
#   --cpu=1                 single vCPU; cwebp is single-threaded
#   --concurrency=4         low concurrency prevents cwebp shell-out contention
#   --timeout=300s          covers full raw-to-webp pipeline for large files
#   --no-allow-unauthenticated  only Eventarc's invoker SA can reach the worker

on:
  workflow_call:
    inputs:
      env_name:
        type: string
        required: true
        description: Target environment — dev or prod
      gcs_bucket:
        type: string
        required: true
        description: GCS bucket name the worker reads from / writes to
      callback_url:
        type: string
        required: true
        description: >-
          Next.js app URL the worker POSTs to after processing
          (NEXT_PUBLIC_SERVER_URL on the worker = app's process-callback endpoint base)
      service:
        type: string
        required: true
        description: Cloud Run worker service name
      region:
        type: string
        required: false
        default: us-central1
      runtime_service_account:
        type: string
        required: true
        description: GCP SA email for Cloud Run revision runtime identity
      dry_run:
        type: boolean
        required: false
        default: false
        description: Build and push only — skip Cloud Run deploy
    secrets:
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: true
      GCP_SERVICE_ACCOUNT_EMAIL:
        required: true
      PROCESSOR_CALLBACK_SECRET:
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy_worker:
    name: Deploy Worker — ${{ inputs.env_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The "prod" environment gate requires reviewer approval + 2h wait window.
    # Mirrors the gate in _deploy-app.yml — prod worker deploys are equally sensitive.
    environment: ${{ inputs.env_name == 'prod' && 'prod' || 'dev' }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Authenticate to GCP
        uses: ./.github/actions/gcp-auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      # Compute image tag and extra_tags in a shell step to avoid nested ${{ }} expressions,
      # which are invalid in GitHub Actions YAML (inner ${{ vars.X }} inside outer ${{ }}).
      - name: Compute image metadata
        id: img
        run: |
          REGISTRY="us-central1-docker.pkg.dev/${{ vars.GCS_PROJECT_ID }}/framehouse-hub/worker"
          if [ "${{ inputs.env_name }}" = "prod" ]; then
            SHA7="${GITHUB_SHA:0:7}"
            echo "tag=sha-${SHA7}" >> $GITHUB_OUTPUT
            echo "extra_tags=${REGISTRY}:latest" >> $GITHUB_OUTPUT
            echo "secret_env=PROD" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.env_name }}" >> $GITHUB_OUTPUT
            echo "extra_tags=" >> $GITHUB_OUTPUT
            echo "secret_env=DEV" >> $GITHUB_OUTPUT
          fi

      - name: Build, push and deploy worker to Cloud Run
        id: deploy
        uses: ./.github/actions/deploy-cloudrun
        with:
          service: ${{ inputs.service }}
          image: us-central1-docker.pkg.dev/${{ vars.GCS_PROJECT_ID }}/framehouse-hub/worker
          tag: ${{ steps.img.outputs.tag }}
          extra_tags: ${{ steps.img.outputs.extra_tags }}
          region: ${{ inputs.region }}
          build_context: ./scripts/worker
          dockerfile: scripts/worker/Dockerfile
          cache_scope: worker-${{ inputs.env_name }}
          service_account: ${{ inputs.runtime_service_account }}
          min_instances: '0'
          max_instances: '2'
          memory: 512Mi
          cpu: '1'
          concurrency: '4'
          timeout: 300s
          no_allow_unauthenticated: 'true'
          secrets: |
            PROCESSOR_CALLBACK_SECRET=PROCESSOR_CALLBACK_SECRET_${{ steps.img.outputs.secret_env }}:latest
          env_vars: |
            GCS_BUCKET=${{ inputs.gcs_bucket }}
            NEXT_PUBLIC_SERVER_URL=${{ inputs.callback_url }}

      # Verify the worker service is active after deploy.
      # The worker is --no-allow-unauthenticated so we can't curl it directly;
      # use gcloud to confirm the latest revision is serving traffic.
      - name: Verify worker service health
        if: ${{ !inputs.dry_run }}
        run: |
          STATUS=$(gcloud run services describe "${{ inputs.service }}" \
            --region="${{ inputs.region }}" \
            --format="value(status.conditions[0].status)" 2>/dev/null)
          if [[ "$STATUS" != "True" ]]; then
            echo "::error::Worker service health check failed. status.conditions[0].status=$STATUS"
            exit 1
          fi
          echo "Worker service active (status.conditions[0].status=True)."

      - name: Step summary
        if: always()
        run: |
          echo "### Worker Deploy — \`${{ inputs.env_name }}\` — ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Service | \`${{ inputs.service }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Region | \`${{ inputs.region }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Callback URL | \`${{ inputs.callback_url }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Digest | \`${{ steps.deploy.outputs.image_digest || 'N/A' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Dry run | \`${{ inputs.dry_run }}\` |" >> $GITHUB_STEP_SUMMARY
