name: Deploy Worker (Dev)
# Worker releases are path-scoped — only rebuilds when scripts/worker/** changes.
# This keeps Artifact Registry under the 0.5 GB free-tier allowance and avoids
# unnecessary Cloud Run revisions.
#
# Shares the deploy-dev concurrency group with deploy-dev.yml to enforce
# deployment ordering: app deploys first, worker queues behind it.
# Rationale: the app exposes /api/media/process-callback; the worker calls it.
# The app must be stable before the worker starts sending callbacks.

on:
  push:
    branches: [dev]
    paths:
      - 'scripts/worker/**'
      - '.github/workflows/deploy-worker-dev.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and push only — skip Cloud Run deploy'
        type: boolean
        default: false

# Shared with deploy-dev.yml — enforces app-first ordering when both trigger
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions: {}

jobs:
  deploy_worker_dev:
    name: Deploy Worker Dev
    uses: ./.github/workflows/_deploy-worker.yml
    permissions:
      id-token: write
      contents: read
    with:
      env_name: dev
      gcs_bucket: framehouse-hub-dev
      callback_url: https://framehouse-hub-dev-588985538639.us-central1.run.app
      service: framehouse-hub-worker-dev
      region: us-central1
      runtime_service_account: ${{ vars.GCP_RUNTIME_SA_EMAIL }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
      PROCESSOR_CALLBACK_SECRET: ${{ secrets.PROCESSOR_CALLBACK_SECRET_DEV }}
