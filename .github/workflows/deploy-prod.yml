name: Production Release (Main)
# Deploys to the production environment on every merge to main.
# Gated by the GitHub Environment "production" — requires 1 reviewer approval
# and a 2-hour wait window before any step executes. This applies to both
# push triggers and workflow_dispatch manual triggers.
#
# Images are tagged with the git SHA (immutable) plus :latest alias.
# Each revision is named with the SHA7 suffix for direct addressability during rollback.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/pull_request_template.md'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip destructive steps (migration + Cloud Run deploy). Build and push only.'
        type: boolean
        default: true

# cancel-in-progress: false — never cancel a prod deploy mid-flight.
# rollback-prod.yml shares this group to serialize with deploys.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions: {}

jobs:
  deploy_prod:
    name: Deploy Prod
    uses: ./.github/workflows/_deploy-app.yml
    permissions:
      id-token: write
      contents: read
    # environment: production is declared inside _deploy-app.yml's deploy job.
    # The environment gate (reviewer approval + wait window) blocks execution there.
    with:
      env_name: prod
      # Full SHA tag — _deploy-app.yml's meta step extracts SHA7 for the revision suffix.
      # We use the full SHA here for uniqueness; the meta step computes sha7 internally.
      docker_tag: sha-${{ github.sha }}
      extra_tags: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/framehouse-hub/app:latest
      gcs_bucket: framehouse-hub-prod
      public_url: https://hub.framehouseworks.com
      cloud_run_service: framehouse-hub-prod
      cloud_run_region: us-central1
      runtime_service_account: ${{ vars.GCP_RUNTIME_SA_EMAIL }}
      run_min_instances: '0'
      run_max_instances: '4'
      # Immutable revision suffix — SHA7 computed by _deploy-app's meta step.
      # Enables direct traffic targeting: gcloud run services update-traffic framehouse-hub-prod --to-revisions=sha-{sha7}=100
      # Pass empty here; meta step inside _deploy-app computes sha7 and uses it.
      revision_suffix: ''
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
      DATABASE_URI: ${{ secrets.DATABASE_URI_PROD }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET_PROD }}
      PROCESSOR_CALLBACK_SECRET: ${{ secrets.PROCESSOR_CALLBACK_SECRET_PROD }}
      SEED_SECRET: ${{ secrets.SEED_SECRET }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
