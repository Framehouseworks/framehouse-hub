name: Continuous Development (Dev)
# Deploys to the dev/RC environment on every merge to dev.
# No re-validation step — quality was proven by the PR that created this merge commit.
# Calls _deploy-app.yml which owns: pre-migration snapshot, migrate, build+push, deploy,
# smoke test, audit record, and snapshot cleanup.

on:
  push:
    branches: [dev]
    # Skip for doc-only commits — no need to rebuild and deploy for markdown changes
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/pull_request_template.md'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip destructive steps (migration + Cloud Run deploy). Build and push only.'
        type: boolean
        default: true

# cancel-in-progress: false — never cancel a deploy mid-flight.
# Rapid pushes queue behind the running deploy; they do not abort it.
# deploy-worker-dev.yml shares this group to enforce app-first ordering.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions: {}

jobs:
  deploy_dev:
    name: Deploy Dev
    uses: ./.github/workflows/_deploy-app.yml
    permissions:
      id-token: write
      contents: read
    with:
      env_name: dev
      docker_tag: dev
      gcs_bucket: framehouse-hub-dev
      public_url: https://dev.framehouseworks.com
      cloud_run_service: framehouse-hub-dev
      cloud_run_region: us-central1
      runtime_service_account: ${{ vars.GCP_RUNTIME_SA_EMAIL }}
      run_min_instances: '0'
      run_max_instances: '4'
      extra_allowed_origins: https://framehouse-hub-dev-588985538639.us-central1.run.app
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
      DATABASE_URI: ${{ secrets.DATABASE_URI_DEV }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET_DEV }}
      PROCESSOR_CALLBACK_SECRET: ${{ secrets.PROCESSOR_CALLBACK_SECRET_DEV }}
      SEED_SECRET: ${{ secrets.SEED_SECRET }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
