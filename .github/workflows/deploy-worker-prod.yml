name: Deploy Worker (Prod)
# Production worker deploy. Mirrors deploy-worker-dev.yml.
# Shares the deploy-prod concurrency group to enforce app-first ordering.
#
# Worker images are tagged with git SHA for prod (immutable), same convention as app.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/worker/**'
      - '.github/workflows/deploy-worker-prod.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and push only — skip Cloud Run deploy'
        type: boolean
        default: false

# Shared with deploy-prod.yml — enforces app-first ordering when both trigger
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions: {}

jobs:
  deploy_worker_prod:
    name: Deploy Worker Prod
    uses: ./.github/workflows/_deploy-worker.yml
    permissions:
      id-token: write
      contents: read
    with:
      env_name: prod
      gcs_bucket: framehouse-hub-prod
      callback_url: https://framehouseworks.com
      service: framehouse-hub-worker-prod
      region: us-central1
      runtime_service_account: ${{ vars.GCP_RUNTIME_SA_EMAIL }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
      PROCESSOR_CALLBACK_SECRET: ${{ secrets.PROCESSOR_CALLBACK_SECRET_PROD }}
