name: GCP Auth + Docker Login
description: >-
  Authenticate to Google Cloud via Workload Identity Federation (keyless OIDC — no
  long-lived service account keys), then log in to Artifact Registry for Docker
  push/pull operations.

  REQUIREMENT: The calling job MUST declare:
    permissions:
      id-token: write   # required to mint the OIDC token for WIF exchange
      contents: read

inputs:
  workload_identity_provider:
    description: >-
      Full WIF provider resource name:
      projects/{project_number}/locations/global/workloadIdentityPools/{pool}/providers/{provider}
    required: true
  service_account:
    description: GCP service account email to impersonate via WIF token exchange
    required: true

outputs:
  access_token:
    description: Short-lived GCP access token (1 h TTL). Used for Docker registry login.
    value: ${{ steps.auth.outputs.access_token }}

runs:
  using: composite
  steps:
    - id: auth
      uses: google-github-actions/auth@v2
      with:
        token_format: access_token
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}

    - uses: docker/login-action@v3
      with:
        registry: us-central1-docker.pkg.dev
        username: oauth2accesstoken
        password: ${{ steps.auth.outputs.access_token }}
