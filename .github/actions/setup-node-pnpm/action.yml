name: Setup Node + pnpm
description: >-
  Install pnpm, setup Node.js with pnpm store cache, and optionally run
  pnpm install --frozen-lockfile. Requires actions/checkout to have already run
  in the calling job before this action is invoked.

inputs:
  node-version:
    description: Node.js version to install
    required: true
  pnpm-version:
    description: pnpm version to install
    required: true
  skip-install:
    description: >-
      Set to 'true' to skip pnpm install. Use in jobs that download a pre-built
      artifact (e.g. the e2e job downloads the .next artifact from quality-gate).
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - if: inputs.skip-install != 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
